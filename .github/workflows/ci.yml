name: macOS checks
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: dtolnay/rust-toolchain@6bed0761d98439e5a578e2877258200ad565ba87
        with:
          toolchain: 1.91.0
          components: rustfmt, clippy
      - name: Native dependencies
        run: brew install opus ffmpeg
      - run: cargo fmt --check
      - run: cargo test --locked
      - run: cargo clippy --locked --all-targets -- -D warnings
      - run: cargo build --locked
      - name: Python checks
        run: python3 -m unittest discover -s scripts -p 'test_*.py'
      - name: Two-peer baseline
        run: python3 scripts/check_p2.py --quality tiny --duration 8 --output runs/ci-baseline
      - name: Mixed audio packet sizes
        run: python3 scripts/check_p2.py --quality tiny --audio-profile minimum --peer-audio-profile standard --duration 8 --output runs/ci-mixed
      - name: Retain synthetic call diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: synthetic-call-diagnostics
          path: runs/ci-*/
          if-no-files-found: ignore
          retention-days: 7
